apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: preparednessforwar-hpa
  namespace: production
  labels:
    app: preparednessforwar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: preparednessforwar-app
  
  # Scaling limits
  minReplicas: 10      # Minimum pods (always-on capacity)
  maxReplicas: 1000    # Maximum pods (burst capacity for 6M req/s)
  
  # Scaling behavior
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up again
      policies:
        - type: Percent
          value: 50        # Scale up by 50% of current replicas
          periodSeconds: 60
        - type: Pods
          value: 10        # Or add 10 pods
          periodSeconds: 60
      selectPolicy: Max    # Use the policy that scales up most
    
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 10        # Scale down by 10% of current replicas
          periodSeconds: 60
        - type: Pods
          value: 5         # Or remove 5 pods
          periodSeconds: 60
      selectPolicy: Min    # Use the policy that scales down least
  
  # Metrics for autoscaling
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Target 70% CPU
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Target 80% memory
    
    # Custom metric: requests per second per pod
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "6000"  # Target 6K req/s per pod (6M / 1000 pods)
    
    # Custom metric: response time
    - type: Pods
      pods:
        metric:
          name: http_request_duration_p95
        target:
          type: AverageValue
          averageValue: "100m"  # Keep P95 response time below 100ms

---
# Vertical Pod Autoscaler (VPA) - Adjust resource requests/limits
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: preparednessforwar-vpa
  namespace: production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: preparednessforwar-app
  
  updatePolicy:
    updateMode: "Auto"  # Automatically apply recommendations
  
  resourcePolicy:
    containerPolicies:
      - containerName: app
        minAllowed:
          cpu: "250m"
          memory: "256Mi"
        maxAllowed:
          cpu: "2000m"
          memory: "2Gi"
        controlledResources: ["cpu", "memory"]
