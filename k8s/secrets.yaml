# Kubernetes Secrets Template
# DO NOT commit actual secrets to Git!
# Use tools like sealed-secrets, external-secrets, or vault

apiVersion: v1
kind: Secret
metadata:
  name: supabase-secret
  namespace: production
type: Opaque
stringData:
  url: "YOUR_SUPABASE_URL"
  anon-key: "YOUR_SUPABASE_ANON_KEY"
  service-role-key: "YOUR_SUPABASE_SERVICE_ROLE_KEY"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: production
type: Opaque
stringData:
  password: "YOUR_REDIS_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: production
type: Opaque
stringData:
  publishable-key: "YOUR_STRIPE_PUBLISHABLE_KEY"
  secret-key: "YOUR_STRIPE_SECRET_KEY"

---
# Using Sealed Secrets (recommended for GitOps)
# 
# 1. Install sealed-secrets controller:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# 2. Install kubeseal CLI:
#    brew install kubeseal
#
# 3. Create sealed secret:
#    kubectl create secret generic supabase-secret \
#      --from-literal=url=YOUR_URL \
#      --from-literal=anon-key=YOUR_KEY \
#      --dry-run=client -o yaml | \
#    kubeseal -o yaml > sealed-supabase-secret.yaml
#
# 4. Commit sealed-supabase-secret.yaml to Git (it's safe!)
#
# 5. Apply to cluster:
#    kubectl apply -f sealed-supabase-secret.yaml

---
# Using External Secrets Operator (recommended for AWS/GCP/Azure)
#
# 1. Install external-secrets:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# 2. Create SecretStore (AWS Secrets Manager example):
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
# 3. Create ExternalSecret:
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: supabase-external-secret
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: supabase-secret
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: production/supabase
        property: url
    - secretKey: anon-key
      remoteRef:
        key: production/supabase
        property: anon_key
    - secretKey: service-role-key
      remoteRef:
        key: production/supabase
        property: service_role_key
