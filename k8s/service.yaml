apiVersion: v1
kind: Service
metadata:
  name: preparednessforwar-service
  namespace: production
  labels:
    app: preparednessforwar
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  sessionAffinity: None
  
  # Load balancer configuration
  externalTrafficPolicy: Local  # Preserve client IP, better performance
  
  selector:
    app: preparednessforwar
    component: backend
  
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: preparednessforwar-internal
  namespace: production
  labels:
    app: preparednessforwar
    component: backend
spec:
  type: ClusterIP
  selector:
    app: preparednessforwar
    component: backend
  
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 3000
  
  # Session affinity for internal communication
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
