apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preparednessforwar-ingress
  namespace: production
  labels:
    app: preparednessforwar
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: "nginx"
    
    # SSL/TLS configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://preparednessforwar.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    
    # Rate limiting (additional layer)
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    
    # Connection settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Keep-alive
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "1000"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
    
    # Load balancing
    nginx.ingress.kubernetes.io/load-balance: "ewma"  # Exponentially weighted moving average
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
spec:
  tls:
    - hosts:
        - preparednessforwar.com
        - www.preparednessforwar.com
        - api.preparednessforwar.com
      secretName: preparednessforwar-tls
  
  rules:
    # Main domain
    - host: preparednessforwar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: preparednessforwar-internal
                port:
                  number: 3000
    
    # WWW subdomain
    - host: www.preparednessforwar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: preparednessforwar-internal
                port:
                  number: 3000
    
    # API subdomain
    - host: api.preparednessforwar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: preparednessforwar-internal
                port:
                  number: 3000

---
# Certificate for TLS/SSL
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preparednessforwar-cert
  namespace: production
spec:
  secretName: preparednessforwar-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: preparednessforwar.com
  dnsNames:
    - preparednessforwar.com
    - www.preparednessforwar.com
    - api.preparednessforwar.com
