version: '3.8'

# Docker Compose for Local Development and Testing
# Includes: Application, Redis, PostgreSQL, Monitoring

services:
  # Application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preparednessforwar-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_MODE=standalone
      
      # Database (if using local PostgreSQL)
      - SUPABASE_USE_POOLER=false
      - DB_POOL_MIN=2
      - DB_POOL_MAX=10
      
      # Caching
      - MEMORY_CACHE_SIZE=1000
      - ENABLE_MEMORY_CACHE=true
      - ENABLE_REDIS_CACHE=true
      
      # Rate limiting
      - RATE_LIMIT_ANONYMOUS=100
      - RATE_LIMIT_AUTHENTICATED=1000
      
      # Monitoring
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: preparednessforwar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # NGINX Load Balancer (optional - for testing multiple instances)
  nginx:
    image: nginx:alpine
    container_name: preparednessforwar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
